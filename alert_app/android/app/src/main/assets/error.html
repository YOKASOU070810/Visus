<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlertBuddy</title>
<style>
  body { font-family: sans-serif; display:flex; align-items:center; justify-content:center;
         height:100vh; margin:0; background:#f0f2f5; color:#333; text-align:center; }
  .box { padding:2rem; }
  h1 { color:#1a73e8; margin-bottom:0.5rem; }
  p { color:#666; margin-bottom:1.5rem; }
  button { background:#1a73e8; color:#fff; border:none; padding:0.75rem 1.5rem;
           border-radius:8px; font-size:1rem; cursor:pointer; }
</style></head>
<body>
<div class="box">
  <h1>AlertBuddy</h1>
  <p>Cannot reach the server.<br>Make sure the AlertBuddy server is running and your phone is on the same WiFi network.</p>
  <button onclick="location.href='http://192.168.1.100:8000'">Retry</button>
</div>
</body>
</html>
